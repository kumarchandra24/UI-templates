<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sreekaram - Owner</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/data.js"></script>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="login" class="card auth">
    <h2 class="grad">Owner Login</h2>
    <input id="e" placeholder="Email"><input id="p" type="password" placeholder="Password">
    <button class="btn" id="go" style="width:100%">Enter</button>
    <p id="m" style="color:#f87171"></p>
  </div>
  <main id="dash" hidden style="margin:auto;position:relative;z-index:2">
    <h2><span class="grad">Owner Console</span> · Sreekaram</h2>
    <div class="grid" id="stats"></div><br>
    <input id="s" placeholder="Search users...">
    <div class="card"><table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Plan</th><th>Revenue</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const users = SK_USERS;
    function draw() {
      const q = $("s").value.toLowerCase();
      $("rows").innerHTML = users.filter((u) => (u.name + u.email).toLowerCase().includes(q)).map((u) =>
        `<tr><td>${u.id}</td><td>${u.name}</td><td>${u.email}</td><td><span class="tag">${u.plan}</span></td>
         <td>₹${u.revenue.toLocaleString("en-IN")}</td>
         <td><button class="btn ghost" onclick="flip(${u.id})">${u.status}</button></td></tr>`).join("");
      const total = users.reduce((a, u) => a + u.revenue, 0);
      $("stats").innerHTML = [["Users", users.length], ["Active", users.filter((u) => u.status === "active").length],
        ["Revenue", "₹" + total.toLocaleString("en-IN")], ["Business plans", users.filter((u) => u.plan === "Business").length]]
        .map((s) => `<div class="card"><p style="color:var(--mute)">${s[0]}</p><h2 class="grad">${s[1]}</h2></div>`).join("");
    }
    function flip(id) { const u = users.find((x) => x.id === id); u.status = u.status === "active" ? "suspended" : "active"; draw(); }
    $("s").oninput = draw;
    $("go").onclick = () => {
      if ($("e").value === SK_OWNER.email && $("p").value === SK_OWNER.password) {
        $("login").hidden = true; $("dash").hidden = false; draw();
      } else $("m").textContent = "Wrong owner credentials.";
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="assets/scene.js"></script>
  <script>skScene(document.getElementById("bg"), 11);</script>
</body>
</html>
