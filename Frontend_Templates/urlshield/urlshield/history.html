<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><title>URLShield — Scan History</title></head><body>
<div id="nav"></div>
<main class="wrap">
  <div class="page-head"><h1>Scan History</h1><p>Every link you analyze is saved on this device only. Re-scan, filter or export it.</p></div>
  <div class="toolbar">
    <input id="s" placeholder="Search links or domains" aria-label="Search history">
    <select id="v" aria-label="Filter by verdict"><option value="">All verdicts</option><option value="safe">Legitimate</option><option value="suspicious">Suspicious</option><option value="phishing">Potential phishing</option></select>
    <button class="btn ghost sm" id="exp">Export CSV</button><button class="btn ghost sm" id="clr">Clear history</button>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>Time</th><th>Link</th><th>Score</th><th>Verdict</th><th>Top reason</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<div id="foot"></div>
<script src="js/app.js"></script>
<script>
function draw(){
  const q=document.getElementById('s').value.toLowerCase(), v=document.getElementById('v').value;
  const list=History_.all().filter(h=>(!v||h.verdict===v)&&(!q||h.url.toLowerCase().includes(q)));
  document.getElementById('rows').innerHTML=list.length?list.map(h=>'<tr><td>'+fmtTime(h.t)+'</td><td class="url" title="'+esc(h.url)+'">'+esc(h.url)+'</td><td><b>'+h.score+'</b></td><td>'+badge(h.verdict)+'</td><td style="color:var(--muted);max-width:280px">'+esc(h.reason)+'</td><td><a class="btn ghost sm" href="analyzer.html?url='+encodeURIComponent(h.url)+'">Re-scan</a></td></tr>').join('')
   :'<tr><td colspan="6" class="empty">'+(History_.all().length?'No scans match this filter.':'No scans yet. Open the URL Analyzer and paste a link.')+'</td></tr>';
}
document.getElementById('s').oninput=draw; document.getElementById('v').onchange=draw;
document.getElementById('clr').onclick=()=>{ if(History_.all().length && confirm('Delete all saved scans?')){History_.clear();draw();toast('History cleared');} };
document.getElementById('exp').onclick=()=>{ const h=History_.all(); if(!h.length){toast('Nothing to export yet');return;}
  const csv='time,url,score,verdict,https,reason\n'+h.map(r=>[new Date(r.t).toISOString(),'"'+r.url.replace(/"/g,'""')+'"',r.score,r.verdict,r.https,'"'+r.reason.replace(/"/g,'""')+'"'].join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='urlshield_history.csv'; a.click(); toast('History exported'); };
draw();
</script></body></html>
