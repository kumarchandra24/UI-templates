<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><title>URLShield — Threat Analytics</title></head><body>
<div id="nav"></div>
<main class="wrap">
  <div class="page-head"><h1>Threat Analytics</h1><p>Patterns across the 50-link dataset and every link you have scanned on this device.</p></div>
  <div class="toolbar"><select id="src" aria-label="Data source"><option value="all">Dataset + my scans</option><option value="ds">Dataset only</option><option value="me">My scans only</option></select></div>
  <div class="grid2">
    <div class="card"><h3>Verdict split</h3><div class="donut-wrap"><canvas id="donut" width="240" height="240" style="width:240px;height:240px"></canvas><div class="donut-leg" id="leg"></div></div></div>
    <div class="card chart-card"><h3>Risk score distribution</h3><canvas id="hist" width="520" height="260"></canvas></div>
  </div>
  <div class="grid2" style="margin-top:20px">
    <div class="card"><h3>Most common warning signs</h3><div class="bars" id="ind" style="margin-top:14px"></div></div>
    <div class="card"><h3>Impersonated brands</h3><div class="bars" id="brands" style="margin-top:14px"></div></div>
  </div>
  <div class="card" style="margin-top:20px"><h3>Average risk by top-level domain</h3><div class="bars" id="tld" style="margin-top:14px"></div></div>
</main>
<div id="foot"></div>
<script src="js/engine.js"></script><script src="js/dataset.js"></script><script src="js/app.js"></script>
<script>
const COL={safe:'#2DD4A0',suspicious:'#FFC247',phishing:'#FF4D6A'};
function items(){
  const s=document.getElementById('src').value, out=[];
  if(s!=='me') URL_DATASET.forEach(d=>out.push({url:d.url,score:d.score,verdict:d.verdict}));
  if(s!=='ds') History_.all().forEach(h=>out.push({url:h.url,score:h.score,verdict:h.verdict}));
  return out.map(o=>({...o,r:URLShield.analyze(o.url)}));
}
function bars(id,map,max,fmt){
  const el=document.getElementById(id), ent=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,7);
  if(!ent.length){el.innerHTML='<div class="empty">Nothing to show yet.</div>';return;}
  const m=max||ent[0][1];
  el.innerHTML=ent.map(([k,v])=>'<div class="bar-row"><span class="t" title="'+esc(k)+'">'+esc(k)+'</span><div class="b"><i data-w="'+(v/m*100)+'"></i></div><b>'+(fmt?fmt(v):v)+'</b></div>').join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.querySelectorAll('i').forEach(i=>i.style.width=i.dataset.w+'%')));
}
function donut(counts){
  const c=document.getElementById('donut'),x=c.getContext('2d'),tot=counts.safe+counts.suspicious+counts.phishing;
  let t0=performance.now();
  (function f(t){
    const k=Math.min(1,(t-t0)/900), e=1-Math.pow(1-k,3);
    x.clearRect(0,0,240,240); let a=-Math.PI/2;
    if(!tot){x.strokeStyle='#2A3866';x.lineWidth=28;x.beginPath();x.arc(120,120,84,0,7);x.stroke();}
    ['safe','suspicious','phishing'].forEach(v=>{ if(!counts[v])return; const sw=counts[v]/tot*Math.PI*2*e;
      x.strokeStyle=COL[v];x.lineWidth=28;x.beginPath();x.arc(120,120,84,a,a+sw-0.03);x.stroke();a+=sw;});
    x.fillStyle='#EAEEFB';x.font='800 34px Sora, sans-serif';x.textAlign='center';x.fillText(String(tot),120,126);
    x.fillStyle='#93A0C8';x.font='13px sans-serif';x.fillText('links',120,148);
    if(k<1)requestAnimationFrame(f);
  })(t0);
  document.getElementById('leg').innerHTML=['safe','suspicious','phishing'].map(v=>'<div><i class="dot '+v+'"></i>'+VLABEL[v]+': <b>'+counts[v]+'</b></div>').join('');
}
function hist(list){
  const c=document.getElementById('hist'),x=c.getContext('2d'),W=c.width,H=c.height,bins=Array(10).fill(0);
  list.forEach(o=>bins[Math.min(9,Math.floor(o.score/10))]++);
  const mx=Math.max(1,...bins); let t0=performance.now();
  (function f(t){
    const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3); x.clearRect(0,0,W,H);
    const bw=(W-40)/10;
    bins.forEach((n,i)=>{ const h=(H-60)*n/mx*e, px=30+i*bw, col=i<2?COL.safe:i<6?COL.suspicious:COL.phishing;
      x.fillStyle=col;x.globalAlpha=.9;x.beginPath();x.roundRect?x.roundRect(px+4,H-30-h,bw-8,h,6):x.rect(px+4,H-30-h,bw-8,h);x.fill();x.globalAlpha=1;
      x.fillStyle='#93A0C8';x.font='12px sans-serif';x.textAlign='center';x.fillText(i*10+'–'+(i*10+9),px+bw/2,H-10);
      if(n){x.fillStyle='#EAEEFB';x.fillText(String(n),px+bw/2,H-36-h);} });
    if(k<1)requestAnimationFrame(f);
  })(t0);
}
function render(){
  const L=items(), counts={safe:0,suspicious:0,phishing:0}; L.forEach(o=>counts[o.verdict]++);
  donut(counts); hist(L);
  const ind={},br={},tl={};
  L.forEach(o=>{ o.r.flags.forEach(f=>{ const k=f.text.replace(/[“”].*?[“”]/g,'').replace(/\(.*?\)/g,'').replace(/:.*$/,'').replace(/\.[a-z]+\b/,'').trim().slice(0,52); ind[k]=(ind[k]||0)+1; });
    if(o.r.impersonates) br[o.r.impersonates]=(br[o.r.impersonates]||0)+1;
    (tl[o.r.tld]=tl[o.r.tld]||[]).push(o.score); });
  bars('ind',ind); bars('brands',br);
  const avg={}; Object.entries(tl).forEach(([k,a])=>{ if(a.length) avg['.'+k+'  ('+a.length+')']=Math.round(a.reduce((s,v)=>s+v,0)/a.length); });
  bars('tld',avg,100,v=>v);
}
document.getElementById('src').onchange=render; render();
</script></body></html>
