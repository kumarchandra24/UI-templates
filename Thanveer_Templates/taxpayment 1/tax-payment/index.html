<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaxFlow — Smart Tax Payment</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="logo">₹</span><div><b>TaxFlow</b><small>Smart Tax Hub</small></div></div><nav><button class="nav active" data-page="dashboard">⌂ <span>Dashboard</span></button><button class="nav" data-page="calculator">⌁ <span>Tax Calculator</span></button><button class="nav" data-page="payments">▣ <span>Payments</span></button><button class="nav" data-page="receipts">▤ <span>Receipts</span></button><button class="nav" data-page="insights">◈ <span>Tax Insights</span></button></nav><div class="sidebox"><b>Need help?</b><p>Ask TaxBot about deductions, deadlines and payments.</p><button onclick="openBot()">Ask TaxBot →</button></div><button class="nav" data-page="settings">⚙ <span>Settings</span></button></aside>
<main><header><button class="hamb" onclick="document.body.classList.toggle('menu')">☰</button><div class="search"><span>⌕</span><input id="search" placeholder="Search payments, receipts..." oninput="globalSearch(this.value)"></div><div class="header-actions"><button class="iconbtn" onclick="toggleNotifications()">♧<i id="notifDot"></i></button><button class="avatar" onclick="showPage('settings')">LT</button><div><b>LalTanveer</b><small>Individual</small></div></div></header><div id="toast"></div><section id="content"></section></main></div>
<div class="modal" id="payModal"><div class="modal-card"><button class="close" onclick="closeModal('payModal')">×</button><h2>Make a Tax Payment</h2><p class="muted">Demo payment flow — no real money is transferred.</p><form onsubmit="makePayment(event)"><label>Tax type<select id="taxType"><option>Income Tax</option><option>GST</option><option>TDS</option><option>Advance Tax</option><option>Property Tax</option></select></label><div class="grid2"><label>Amount (₹)<input id="payAmount" type="number" min="1" required placeholder="e.g. 12500"></label><label>Assessment year<select><option>2026–27</option><option>2025–26</option></select></label></div><label>Payment method<select id="method"><option>UPI</option><option>Net Banking</option><option>Debit Card</option></select></label><label>UPI / reference note<input id="payNote" placeholder="Optional note"></label><button class="primary full">Pay securely →</button></form></div></div>
<div class="modal" id="botModal"><div class="modal-card bot"><button class="close" onclick="closeModal('botModal')">×</button><h2>TaxBot ✦</h2><div id="chat" class="chat"><div class="botmsg">Hi LalTanveer! Ask me about tax calculations, deductions, deadlines or your payments.</div></div><form onsubmit="askBot(event)" class="chatform"><input id="botInput" placeholder="Ask something..." required><button class="primary">Send</button></form></div></div>
<div class="modal" id="receiptModal"><div class="modal-card" id="receiptBox"></div></div>
<script src="script.js"></script></body></html>
